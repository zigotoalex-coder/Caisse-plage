rder:0;border-radius:16px;padding:20px;font-weight:900;font-size:18px}.cash{background:#3ca769;color:#fff}.cardpay{background:#5267d8;color:#fff}.n5{background:#c8cbd0}.n10{background:#e8929c}.n20{background:#6ba9e8;color:#fff}.n50{background:#e6a45f}.back{border:0;background:transparent;font-weight:800;padding:10px 0}.nav{position:fixed;left:0;right:0;bottom:0;background:#fffffff5;border-top:1px solid #e1e6ed;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:9}.navin{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav button{border:0;border-radius:12px;padding:11px 4px;font-weight:800}.hidden{display:none}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi{background:#fff;border:1px solid #e1e6ed;border-radius:15px;padding:12px}.kpi b{display:block;font-size:20px;margin-top:4px}.sellerBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.sellerBtns button{border:0;border-radius:13px;padding:13px 3px;font-weight:800}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px 4px;border-bottom:1px solid #e1e6ed}.login{max-width:430px;margin:10vh auto}.login input{width:100%;padding:18px;border:1px solid #e1e6ed;border-radius:14px;font-size:22px;text-align:center;margin:12px 0}.step{display:flex;gap:8px;margin:10px 0}.step span{flex:1;text-align:center;padding:8px 4px;border-radius:10px;background:#e8ecf2;font-size:12px;font-weight:800}.step .on{background:#17202b;color:#fff}.moneyRow,.stockRow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #e6e9ee}.counter{display:grid;grid-template-columns:40px 48px 40px;align-items:center;gap:5px}.counter button{height:38px;border:0;border-radius:10px;background:#e8ecf2;font-weight:950;font-size:20px}.counter span{text-align:center;font-weight:900}.warn{background:#fff4d8;border:1px solid #f0d58c;border-radius:14px;padding:12px;margin:10px 0}.ok{background:#e9f7ef;border:1px solid #a9dbbd;border-radius:14px;padding:12px;margin:10px 0}.result{font-size:27px;font-weight:950;text-align:center}.summaryLine{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #e6e9ee}@media(max-width:380px){.w{padding-left:7px;padding-right:7px}.saleLayout{grid-template-columns:46% 54%;gap:6px}.prod{font-size:16px;min-height:76px;padding:10px}.basket{padding:9px}.basketTotal{font-size:17px}.basket .big{font-size:14px}}

body.patron{background:#101722;color:#eef4fc}body.patron .w{max-width:1100px;padding:15px 12px 90px}body.patron .card,body.patron .kpi{background:#1c2938;border-color:#34485f;box-shadow:none;color:#f1f6ff}body.patron .muted{color:#a3b4c9}body.patron .nav{background:#152131;border-color:#34485f}body.patron .nav button{background:#2c4059;color:white}
.ptabs{display:flex;gap:7px;overflow-x:auto;margin:13px 0;padding-bottom:5px}.ptabs button,.pbtn{border:1px solid #40536b;background:#27384d;color:#f1f6ff;padding:12px;border-radius:12px;font-weight:750;white-space:nowrap}.ptabs .sel{background:#3678e8;border-color:#3678e8}.ptop{display:flex;justify-content:space-between;gap:8px;align-items:center}.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.ptile{background:#202f40;border:1px solid #3b4c60;border-radius:15px;padding:13px;min-width:0}.ptile small{display:block;color:#a5b5c9;margin-bottom:8px}.ptile strong{font-size:22px;overflow-wrap:anywhere}.pplus{color:#6de0aa}.pminus{color:#ff9c9c}.pwarn{color:#ffd18b}.prow{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:11px 0;border-bottom:1px solid #35475a}.prow b{text-align:right}.pform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pform label{display:block;color:#b7c6d7;font-size:12px;margin-bottom:4px}.pform input,.pform select,.pinput{width:100%;min-width:0;border:1px solid #496078;border-radius:10px;background:#121e2c;color:white;padding:11px;font-size:16px}.pprimary{background:#3579e8;color:white;border:0;border-radius:11px;padding:13px 15px;font-weight:800;margin-top:12px}.psecondary{background:#34465d;color:white;border:0;border-radius:11px;padding:12px;font-weight:750}.psmall{font-size:12px;color:#a9bad0}.pchip{border-radius:20px;padding:5px 9px;background:#35485f;font-size:12px;font-weight:750}.pchip.low{background:#5d4427;color:#ffe1a0}.pchip.out{background:#5b303c;color:#ffb5bf}.pchip.good{background:#224d43;color:#9ff1ca}.pcards{display:grid;grid-template-columns:1fr;gap:10px}.pcount{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;text-align:center;margin:15px 0}.pcount small{font-size:10px;color:#b5c4d6}.pcount b{display:block;font-size:20px;margin-top:5px}body.patron th,body.patron td{border-color:#35475a}body.patron table{font-size:12px}body.patron .warn{background:#4c3d26;border-color:#8d7044;color:#ffe6bb}body.patron .ok{background:#224d43;border-color:#407c66;color:#a9f5d3}@media(min-width:760px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.pcards{grid-template-columns:repeat(3,minmax(0,1fr))}.pform{grid-template-columns:repeat(3,minmax(0,1fr))}}

</style></head><body><div id="app"></div><div id="nav" class="nav hidden"><div id="navin" class="navin"></div></div><script>
const P={ice:{name:"Glace",price:3,cls:"ice"},soda:{name:"Canette",price:3,cls:"soda"},water:{name:"Eau",price:2,cls:"water"},donut:{name:"Beignet",price:3,cls:"donut"}};
const S={"0902":{name:"Luna",patron:true},"1201":{name:"Lucas",patron:false},"1301":{name:"Emma",patron:false}};
const FLOAT={10:1,5:3,2:5,1:10,.5:10},FLOAT_TOTAL=50,DENOMS=[50,20,10,5,2,1,.5];
const DEFAULT_LOAD={ice:30,soda:24,water:30,donut:20},LOW={ice:5,soda:5,water:5,donut:4};
let seller=null,cart={},received=0;
const E=n=>Number(n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const sales=()=>get("cpSales",[]),saveSales=a=>set("cpSales",a),sessions=()=>get("cpSessions",{}),saveSessions=x=>set("cpSessions",x);
const dateKey=(d=new Date())=>{let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`};
const sk=()=>seller?`${seller.id}-${dateKey()}`:""; const session=()=>sessions()[sk()]||null;
const total=()=>Object.entries(cart).reduce((s,[k,q])=>s+P[k].price*q,0);
function page(x,nav=true){document.querySelector("#app").innerHTML='<div class="w">'+x+'</div>';renderNav(nav)}
function renderNav(show=true){let n=document.querySelector("#nav"),i=document.querySelector("#navin");if(!show||!seller){n.classList.add("hidden");return}let s=session();if(!s||s.closed){n.classList.add("hidden");return}i.innerHTML=`<button onclick="till()">🧾 Caisse</button><button onclick="closeDay()">🌙 Fin journée</button>${seller.patron?'<button onclick="dash()">📊 Patron</button>':''}`;i.style.gridTemplateColumns=seller.patron?'1fr 1fr 1fr':'1fr 1fr';n.classList.remove("hidden")}
function login(){document.body.classList.remove("patron");page(`<div class="login card"><h1>Caisse Vendeur</h1><p class="muted">Connexion vendeur</p><input id="id" inputmode="numeric" placeholder="Numéro vendeur"><button class="big primary" onclick="log()">Se connecter</button><p class="muted" style="text-align:center">Test : Luna — 0902</p></div>`,false)}
function log(){let id=document.querySelector("#id").value.trim(),u=S[id];if(!u)return alert("Numéro vendeur inconnu.");seller={id,name:u.name,patron:u.patron};cart={};let s=session();if(seller.patron)return patronChoice();if(s?.closed)return closedSummary(s);if(!s)return openFloat();if(!s.loaded)return loadStock();till()}
function patronChoice(){document.body.classList.remove("patron");let s=session();page(`<div class="login card"><h1>Bienvenue ${seller.name}</h1><p class="muted">Choisis ton espace de test.</p><button class="big primary" onclick="dash()">📊 Espace Patron</button><button class="big secondary" style="margin-top:10px" onclick="${s?.closed?'closedSummary(session())':s?.loaded?'till()':s?'loadStock()':'openFloat()'}">🧾 Espace Vendeur</button><button class="back" onclick="logout()">Déconnexion</button></div>`,false)}
function steps(n){return `<div class="step"><span class="${n===1?'on':''}">1 · Fond</span><span class="${n===2?'on':''}">2 · Produits</span><span class="${n===3?'on':''}">3 · Tournée</span></div>`}
function openFloat(){page(`${steps(1)}<h1>Bonjour ${seller.name}</h1><div class="card"><h2>Vérifie ton fond de caisse</h2><p class="muted">Compte simplement chaque coupure. L'application fait les calculs.</p>${Object.entries(FLOAT).reverse().map(([d,q])=>moneyCounter("of",d,q)).join("")}</div><button class="big primary" onclick="validateOpenFloat()">Valider mon fond de caisse</button>`,false)}
function moneyCounter(prefix,d,q=0){let id=prefix+String(d).replace('.','_');return `<div class="moneyRow"><b>${E(d)}</b><div class="counter"><button onclick="chg('${id}',-1)">−</button><span id="${id}" data-v="${d}">${q}</span><button onclick="chg('${id}',1)">+</button></div></div>`}
function chg(id,n){let e=document.getElementById(id);e.textContent=Math.max(0,(parseInt(e.textContent)||0)+n)}
function validateOpenFloat(){let sum=[...document.querySelectorAll('[id^="of"]')].reduce((s,e)=>s+Number(e.dataset.v)*Number(e.textContent),0);if(Math.abs(sum-FLOAT_TOTAL)>.001)return alert(`Le fond doit être exactement de ${E(FLOAT_TOTAL)}. Tu as compté ${E(sum)}.`);let all=sessions();all[sk()]={sellerId:seller.id,seller:seller.name,date:dateKey(),openedAt:new Date().toISOString(),openingFloat:sum,loaded:false,closed:false,stock:{}};saveSessions(all);loadStock()}
function loadStock(){let s=session();page(`${steps(2)}<h1>Chargement de la charrette</h1><p class="muted">Prends les quantités indiquées au dépôt puis confirme ce que tu as réellement chargé.</p><div class="card">${Object.entries(DEFAULT_LOAD).map(([k,q])=>`<div class="stockRow"><div><b>${P[k].name}</b><small class="muted" style="display:block">Proposé : ${q}</small></div><div class="counter"><button onclick="chg('ld_${k}',-1)">−</button><span id="ld_${k}">${q}</span><button onclick="chg('ld_${k}',1)">+</button></div></div>`).join("")}</div><button class="big primary" onclick="validateLoad()">J'ai chargé ma charrette</button>`,false)}
function validateLoad(){let all=sessions(),s=all[sk()],stock={};Object.keys(P).forEach(k=>stock[k]=Number(document.getElementById('ld_'+k).textContent));s.stock=stock;s.initialStock={...stock};s.loaded=true;s.loadedAt=new Date().toISOString();all[sk()]=s;saveSessions(all);till()}
function till(){document.body.classList.remove("patron");if(!seller)return login();let s=session();if(!s)return openFloat();if(s.closed)return closedSummary(s);if(!s.loaded)return loadStock();let lines=Object.entries(cart).filter(([,q])=>q>0).map(([k,q])=>`<div class="basketLine"><b>${P[k].name}</b><div class="qty"><button onclick="cartQty('${k}',-1)">−</button><span>${q}</span><button onclick="cartQty('${k}',1)">+</button><small>${E(q*P[k].price)}</small></div></div>`).join("")||'<p class="muted" style="font-size:13px">Commande vide</p>';let prods=Object.entries(P).map(([k,p])=>{let st=s.stock[k]||0,available=st-(cart[k]||0),low=available<=LOW[k],zero=available<=0;return `<button class="prod ${p.cls} ${low?'low':''} ${zero?'zero':''}" data-stock="${zero?'Épuisé':available+' restant'+(available>1?'s':'')}" ${zero?'disabled':''} onclick="add('${k}')">${p.name}<small>${E(p.price)}</small></button>`}).join("");page(`<button class="back" onclick="logout()">Déconnexion</button><h1>Caisse · ${seller.name}</h1>${steps(3)}<div class="saleLayout"><div class="products">${prods}</div><div class="card basket"><h2>Commande</h2><div class="basketLines">${lines}</div><div class="basketTotal"><span>Total</span><span>${E(total())}</span></div><button class="big primary" ${total()?'':'disabled'} onclick="payment()">Valider</button></div></div>`)}
function logout(){document.body.classList.remove("patron");seller=null;cart={};login()} function add(k){cart[k]=(cart[k]||0)+1;till()} function cartQty(k,n){cart[k]=Math.max(0,(cart[k]||0)+n);if(!cart[k])delete cart[k];till()}
function payment(){if(!total())return;page(`<button class="back" onclick="till()">← Retour</button><h1>Paiement</h1><div class="card result">${E(total())}</div><div class="paygrid"><button class="pay cash" onclick="cash()">💶 Espèces</button><button class="pay cardpay" onclick="finish('Carte')">💳 Carte</button></div>`,false)}
function cash(){page(`<button class="back" onclick="payment()">← Retour</button><h1>Espèces</h1><div class="card"><div class="result">${E(total())}</div><div class="notes"><button class="note n5" onclick="recv(5)">5 €</button><button class="note n10" onclick="recv(10)">10 €</button><button class="note n20" onclick="recv(20)">20 €</button><button class="note n50" onclick="recv(50)">50 €</button></div><input id="manual" inputmode="decimal" placeholder="Autre montant reçu" style="width:100%;margin-top:12px;padding:15px;border:1px solid #ddd;border-radius:12px"><button class="big secondary" style="margin-top:10px" onclick="recv(parseFloat(document.querySelector('#manual').value.replace(',','.')))">Calculer</button><div id="change"></div></div>`,false)}
function recv(n){if(!Number.isFinite(n)||n<total())return alert("Montant insuffisant.");received=n;document.querySelector("#change").innerHTML=`<h2 style="text-align:center">Monnaie : ${E(n-total())}</h2><button class="big cash" onclick="finish('Espèces')">Valider l'encaissement</button>`}
function finish(mode){let a=sales(),items=Object.entries(cart).map(([k,q])=>({key:k,name:P[k].name,qty:q,unit:P[k].price})),v=total(),all=sessions(),s=all[sk()];for(let i of items)s.stock[i.key]=Math.max(0,(s.stock[i.key]||0)-i.qty);a.push({id:"tx-"+Date.now()+"-"+Math.random().toString(16).slice(2),at:new Date().toISOString(),sellerId:seller.id,seller:seller.name,total:v,payment:mode,received:mode==="Espèces"?received:null,items});saveSales(a);all[sk()]=s;saveSessions(all);cart={};received=0;page(`<div class="card" style="text-align:center;margin-top:20vh"><h1>✓ Vente enregistrée</h1><h2>${E(v)}</h2><p class="muted">${mode}</p><button class="big primary" onclick="till()">Nouvelle vente</button></div>`)}
function daySales(id=seller?.id){return sales().filter(t=>t.sellerId===id&&dateKey(new Date(t.at))===dateKey())}
function closeDay(){if(!seller)return login();let s=session();if(!s||s.closed)return s?closedSummary(s):openFloat();cart={};stockCount()}
function stockCount(){let s=session();page(`<h1>Fin de journée</h1><h2>1 · Compte les produits restants</h2><p class="muted">L'application indique le stock théorique. Compte physiquement ce qu'il reste dans la charrette.</p><div class="card">${Object.keys(P).map(k=>`<div class="stockRow"><div><b>${P[k].name}</b><small class="muted" style="display:block">Théorique : ${s.stock[k]||0}</small></div><div class="counter"><button onclick="chg('end_${k}',-1)">−</button><span id="end_${k}">${s.stock[k]||0}</span><button onclick="chg('end_${k}',1)">+</button></div></div>`).join("")}</div><button class="big primary" onclick="saveStockCount()">Valider le décompte produits</button>`,false)}
function saveStockCount(){let all=sessions(),s=all[sk()],physical={},diff={};Object.keys(P).forEach(k=>{physical[k]=Number(document.getElementById('end_'+k).textContent);diff[k]=physical[k]-(s.stock[k]||0)});s.physicalStock=physical;s.stockDiff=diff;all[sk()]=s;saveSessions(all);cashCount()}
function cashCount(){page(`<h1>Fin de journée</h1><h2>2 · Compte les espèces</h2><p class="muted">Compte chaque coupure séparément. Le montant attendu reste volontairement masqué jusqu'à validation.</p><div class="card">${DENOMS.map(d=>moneyCounter('cc',d,0)).join('')}</div><button class="big primary" onclick="confirmCashCount()">J'ai terminé mon comptage</button>`,false)}
function confirmCashCount(){let counts={},sum=0;[...document.querySelectorAll('[id^="cc"]')].forEach(e=>{let d=Number(e.dataset.v),q=Number(e.textContent);counts[d]=q;sum+=d*q});page(`<h1>Confirme ton comptage</h1><div class="card"><p class="muted">Tu as déclaré :</p><div class="result">${E(sum)}</div><p class="muted" style="text-align:center">Recompte ta caisse avant de confirmer définitivement.</p></div><button class="big primary" onclick='finalizeCash(${JSON.stringify(counts)},${sum})'>Confirmer définitivement</button><button class="big secondary" style="margin-top:8px" onclick="cashCount()">Recompter</button>`,false)}
function chooseFloat(counts){let target=FLOAT_TOTAL,left=target,out={};for(let d of [10,5,2,1,.5]){let preferred=FLOAT[d]||0,use=Math.min(preferred,counts[d]||0,Math.floor((left+.001)/d));out[d]=use;left-=use*d}for(let d of [20,10,5,2,1,.5]){let can=Math.min((counts[d]||0)-(out[d]||0),Math.floor((left+.001)/d));if(can>0){out[d]=(out[d]||0)+can;left-=can*d}}return {mix:out,complete:Math.abs(left)<.001,left}}
function finalizeCash(counts,sum){let a=daySales(),cashSales=a.filter(t=>t.payment==='Espèces').reduce((x,t)=>x+t.total,0),theoretical=FLOAT_TOTAL+cashSales,diff=sum-theoretical,flt=chooseFloat(counts),deposit=Math.max(0,sum-(flt.complete?FLOAT_TOTAL:(FLOAT_TOTAL-flt.left))),all=sessions(),s=all[sk()];s.cashCounts=counts;s.actualCash=sum;s.theoreticalCash=theoretical;s.cashDiff=diff;s.floatMix=flt.mix;s.deposit=deposit;s.closed=true;s.closedAt=new Date().toISOString();all[sk()]=s;saveSessions(all);closedSummary(s)}
function closedSummary(s){let a=daySales(s.sellerId),ca=a.reduce((x,t)=>x+t.total,0),cash=a.filter(t=>t.payment==='Espèces').reduce((x,t)=>x+t.total,0),mix=Object.entries(s.floatMix||{}).filter(([,q])=>q).map(([d,q])=>`${q} × ${E(d)}`).join('<br>')||'—',stockDiff=Object.keys(P).map(k=>`<div class="summaryLine"><span>${P[k].name}</span><b>${(s.stockDiff?.[k]||0)>=0?'+':''}${s.stockDiff?.[k]||0}</b></div>`).join('');page(`<h1>Journée terminée ✓</h1><div class="card"><div class="result">${E(ca)}</div><p class="muted" style="text-align:center">Chiffre d'affaires de ta journée</p><div class="kpis"><div class="kpi">Ventes<b>${a.length}</b></div><div class="kpi">Panier moyen<b>${E(a.length?ca/a.length:0)}</b></div><div class="kpi">Espèces<b>${E(cash)}</b></div><div class="kpi">Carte<b>${E(ca-cash)}</b></div></div></div><div class="card"><h2>Clôture caisse</h2><div class="summaryLine"><span>Écart caisse</span><b>${s.cashDiff>=0?'+':''}${E(s.cashDiff)}</b></div><div class="summaryLine"><span>À déposer</span><b>${E(s.deposit)}</b></div><p><b>Fond à conserver :</b><br>${mix}</p></div><div class="card"><h2>Écarts de stock</h2>${stockDiff}</div><button class="big secondary" onclick="logout()">Déconnexion</button>${seller?.patron?'<button class="big primary" style="margin-top:8px" onclick="dash()">Ouvrir Patron</button>':''}`,false)}
// Module Patron V0 — stockage local uniquement. Aucune synchronisation inter-appareils.
const PE=Object.keys(P), STAFF=Object.entries(S).map(([id,v])=>({id,name:v.name}));
const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=x=>Math.max(0,Number(x)||0), round=x=>Math.round((Number(x)||0)*100)/100;
const pg=(k,d)=>get('cpPatronV0_'+k,d),ps=(k,v)=>set('cpPatronV0_'+k,v);
