const FLOAT={10:1,5:3,2:5,1:10,.5:10},FLOAT_TOTAL=50,DENOMS=[50,20,10,5,2,1,.5];

const E=n=>Number(n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

function page(x,nav=true){document.querySelector("#app").innerHTML='<div class="w">'+x+'</div>';renderNav(nav)}
function renderNav(show=true){let n=document.querySelector("#nav"),i=document.querySelector("#navin");if(!show||!seller){n.classList.add("hidden");return}let s=session();if(!s||s.closed){n.classList.add("hidden");return}i.innerHTML=`<button onclick="till()">🧾 Caisse</button><button onclick="closeDay()">🌙 Fin journée</button>${seller.patron?'<button onclick="dash()">📊 Patron</button>':''}`;i.style.gridTemplateColumns=seller.patron?'1fr 1fr 1fr':'1fr 1fr';n.classList.remove("hidden")}
function login(){document.body.classList.remove("patron");page(`<div class="login card"><h1>Caisse Vendeur</h1><p class="muted">Connexion vendeur</p><input id="id" inputmode="numeric" placeholder="Numéro vendeur"><button class="big primary" onclick="log()">Se connecter</button><p class="muted" style="text-align:center">Test : Luna — 0902</p></div>`,false)}
function log(){let id=document.querySelector("#id").value.trim(),u=S[id];if(!u)return alert("Numéro vendeur inconnu.");seller={id,name:u.name,patron:u.patron};cart={};let s=session();if(seller.patron)return patronChoice();if(s?.closed)return closedSummary(s);if(!s)return openFloat();if(!s.loaded)return loadStock();till()}

function openFloat(){page(`${steps(1)}<h1>Bonjour ${seller.name}</h1><div class="card"><h2>Vérifie ton fond de caisse</h2><p class="muted">Compte simplement chaque coupure. L'application fait les calculs.</p>${Object.entries(FLOAT).reverse().map(([d,q])=>moneyCounter("of",d,q)).join("")}</div><button class="big primary" onclick="validateOpenFloat()">Valider mon fond de caisse</button>`,false)}
function moneyCounter(prefix,d,q=0){let id=prefix+String(d).replace('.','_');return `<div class="moneyRow"><b>${E(d)}</b><div class="counter"><button onclick="chg('${id}',-1)">−</button><span id="${id}" data-v="${d}">${q}</span><button onclick="chg('${id}',1)">+</button></div></div>`}
function chg(id,n){let e=document.getElementById(id);e.textContent=Math.max(0,(parseInt(e.textContent)||0)+n)}
function validateOpenFloat(){let sum=[...document.querySelectorAll('[id^="of"]')].reduce((s,e)=>s+Number(e.dataset.v)*Number(e.textContent),0);if(Math.abs(sum-FLOAT_TOTAL)>.001)return alert(`Le fond doit être exactement de ${E(FLOAT_TOTAL)}. Tu as compté ${E(sum)}.`);let all=sessions();all[sk()]={sellerId:seller.id,seller:seller.name,date:dateKey(),openedAt:new Date().toISOString(),openingFloat:sum,loaded:false,closed:false,stock:{}};saveSessions(all);loadStock()}

function finish(mode){let a=sales(),items=Object.entries(cart).map(([k,q])=>({key:k,name:P[k].name,qty:q,unit:P[k].price})),v=total(),all=sessions(),s=all[sk()];valuation();for(let i of items)s.stock[i.key]=Math.max(0,(s.stock[i.key]||0)-i.qty);let transactionCost=saleCost(items,seller.id);a.push({cogs:transactionCost,id:"tx-"+Date.now()+"-"+Math.random().toString(16).slice(2),at:new Date().toISOString(),sellerId:seller.id,seller:seller.name,total:v,payment:mode,received:mode==="Espèces"?received:null,items});saveSales(a);all[sk()]=s;saveSessions(all);cart={};received=0;page(`<div class="card" style="text-align:center;margin-top:20vh"><h1>✓ Vente enregistrée</h1><h2>${E(v)}</h2><p class="muted">${mode}</p><button class="big primary" onclick="till()">Nouvelle vente</button></div>`)}

function cashCount(){page(`<h1>Fin de journée</h1><h2>2 · Compte les espèces</h2><p class="muted">Compte chaque coupure séparément. Le montant attendu reste volontairement masqué jusqu'à validation.</p><div class="card">${DENOMS.map(d=>moneyCounter('cc',d,0)).join('')}</div><button class="big primary" onclick="confirmCashCount()">J'ai terminé mon comptage</button>`,false)}
function confirmCashCount(){let counts={},sum=0;[...document.querySelectorAll('[id^="cc"]')].forEach(e=>{let d=Number(e.dataset.v),q=Number(e.textContent);counts[d]=q;sum+=d*q});page(`<h1>Confirme ton comptage</h1><div class="card"><p class="muted">Tu as déclaré :</p><div class="result">${E(sum)}</div><p class="muted" style="text-align:center">Recompte ta caisse avant de confirmer définitivement.</p></div><button class="big primary" onclick='finalizeCash(${JSON.stringify(counts)},${sum})'>Confirmer définitivement</button><button class="big secondary" style="margin-top:8px" onclick="cashCount()">Recompter</button>`,false)}
function chooseFloat(counts){let target=FLOAT_TOTAL,left=target,out={};for(let d of [10,5,2,1,.5]){let preferred=FLOAT[d]||0,use=Math.min(preferred,counts[d]||0,Math.floor((left+.001)/d));out[d]=use;left-=use*d}for(let d of [20,10,5,2,1,.5]){let can=Math.min((counts[d]||0)-(out[d]||0),Math.floor((left+.001)/d));if(can>0){out[d]=(out[d]||0)+can;left-=can*d}}return {mix:out,complete:Math.abs(left)<.001,left}}
function finalizeCash(counts,sum){let a=daySales(),cashSales=a.filter(t=>t.payment==='Espèces').reduce((x,t)=>x+t.total,0),theoretical=FLOAT_TOTAL+cashSales,diff=sum-theoretical,flt=chooseFloat(counts),deposit=Math.max(0,sum-(flt.complete?FLOAT_TOTAL:(FLOAT_TOTAL-flt.left))),all=sessions(),s=all[sk()];s.cashCounts=counts;s.actualCash=sum;s.theoreticalCash=theoretical;s.cashDiff=diff;s.floatMix=flt.mix;s.deposit=deposit;s.closed=true;s.closedAt=new Date().toISOString();all[sk()]=s;saveSessions(all);closedSummary(s)}
function closedSummary(s){let a=daySales(s.sellerId),ca=a.reduce((x,t)=>x+t.total,0),cash=a.filter(t=>t.payment==='Espèces').reduce((x,t)=>x+t.total,0),mix=Object.entries(s.floatMix||{}).filter(([,q])=>q).map(([d,q])=>`${q} × ${E(d)}`).join('<br>')||'—',stockDiff=Object.keys(P).map(k=>`<div class="summaryLine"><span>${P[k].name}</span><b>${(s.stockDiff?.[k]||0)>=0?'+':''}${s.stockDiff?.[k]||0}</b></div>`).join('');page(`<h1>Journée terminée ✓</h1><div class="card"><div class="result">${E(ca)}</div><p class="muted" style="text-align:center">Chiffre d'affaires de ta journée</p><div class="kpis"><div class="kpi">Ventes<b>${a.length}</b></div><div class="kpi">Panier moyen<b>${E(a.length?ca/a.length:0)}</b></div><div class="kpi">Espèces<b>${E(cash)}</b></div><div class="kpi">Carte<b>${E(ca-cash)}</b></div></div></div><div class="card"><h2>Clôture caisse</h2><div class="summaryLine"><span>Écart caisse</span><b>${s.cashDiff>=0?'+':''}${E(s.cashDiff)}</b></div><div class="summaryLine"><span>À déposer</span><b>${E(s.deposit)}</b></div><p><b>Fond à conserver :</b><br>${mix}</p></div><div class="card"><h2>Écarts de stock</h2>${stockDiff}</div><button class="big secondary" onclick="logout()">Déconnexion</button>${seller?.patron?'<button class="big primary" style="margin-top:8px" onclick="dash()">Ouvrir Patron</button>':''}`,false)}

function freeDepot(){return pg('freeDepot',{})}
function freeCarts(){return pg('freeCarts',{})}
function registerFreeDepot(k,q){let d=freeDepot();d[k]=Math.max(0,(d[k]||0)+q);ps('freeDepot',d)}
function transferFree(id,k,q){let d=freeDepot(),c=freeCarts(),take=Math.min(q,d[k]||0);d[k]=(d[k]||0)-take;c[id]??={};c[id][k]=(c[id][k]||0)+take;ps('freeDepot',d);ps('freeCarts',c)}
// CUMP mobile : un stock valorisé commun au dépôt et aux charrettes.
// Les entrées gratuites augmentent la quantité sans augmenter la valeur.
// Le coût est figé sur chaque ligne de vente au moment de l'encaissement.
function physicalStock(k){let q=N(depot()[k]);for(const [key,ss] of Object.entries(sessions())){if(key.endsWith('-'+dateKey())&&ss.loaded&&!ss.closed)q+=N(ss.stock?.[k])}return q}
function valuation(){let v=pg('valuation',null);if(v)return v;v={};let costs=pg('costs',{}),fd=freeDepot(),fc=freeCarts();for(const k of PE){let qty=physicalStock(k),g=N(fd[k]);for(const x of Object.values(fc))g+=N(x[k]);v[k]={qty,value:Math.max(0,qty-g)*N(costs[k])}}ps('valuation',v);return v}
function unitCump(k){let x=valuation()[k];return x&&x.qty>0?x.value/x.qty:0}
function cumpIn(k,q,value){if(q<=0)return;let v=valuation(),x=v[k]||(v[k]={qty:0,value:0});x.qty+=q;x.value+=value;ps('valuation',v)}
function cumpOut(k,q){if(q<=0)return 0;let v=valuation(),x=v[k]||(v[k]={qty:0,value:0});let avg=x.qty>0?x.value/x.qty:0,used=Math.min(q,x.qty),cost=used*avg;x.qty=Math.max(0,x.qty-used);x.value=Math.max(0,x.value-cost);if(x.qty===0)x.value=0;ps('valuation',v);return cost}
function saleCost(items,id){let sum=0;for(const i of items){let avg=unitCump(i.key),cost=cumpOut(i.key,i.qty);i.cumpUnit=avg;i.cost=round(cost);i.costMethod='CUMP';sum+=cost}return round(sum)}
function updateCost(k,q,ttc){cumpIn(k,q,ttc);let cs=pg('costs',{});cs[k]=unitCump(k);ps('costs',cs)}
function pCumpInfo(){let v=valuation(),rows=PE.filter(k=>N(v[k]?.qty)>0).map(k=>'<div class="prow"><span>'+safe(P[k].name)+'<br><small class="psmall">'+N(v[k].qty)+' unités · valeur restante '+E(v[k].value)+'</small></span><b>'+E(unitCump(k))+' / unité</b></div>').join('');return '<div class="card"><h2>Valorisation CUMP · dépôt + charrettes</h2><p class="psmall">Coût moyen = valeur d’achat restante ÷ quantité restante. Les dons fournisseurs ajoutent des unités à 0 €. Les transferts ne changent pas le coût. Les ventes figent leur coût au moment de l’encaissement.</p>'+(rows||'<p class="psmall">Aucun stock valorisé.</p>')+'</div>'}

function pMove(k,delta,why,who){let d=depot();if(N(d[k])+delta<0)throw Error('Stock du dépôt insuffisant.');d[k]=N(d[k])+delta;ps('depot',d);ps('moves',[...moves(),{at:new Date().toISOString(),key:k,delta,why,who}])}

function pStocks(){ptab='stocks';let html='<h2>Stocks</h2><div class="ptabs">'+[['charrettes','Charrettes'],['depot','Dépôt'],['historique','Mouvements']].map(([k,v])=>'<button class="'+(substock===k?'sel':'')+'" onclick="substock=\''+k+'\';pStocks()">'+v+'</button>').join('')+'</div>';
 if(substock==='charrettes'){html+='<p class="psmall">Les stocks affichés proviennent uniquement des sessions enregistrées sur cet appareil.</p><div class="pcards">'+pCarts().map(u=>{let active=!!u.s?.loaded,st=u.s?.stock||{},zero=active&&PE.some(k=>N(st[k])===0),low=active&&PE.some(k=>N(st[k])<=LOW[k]);return '<div class="ptile"><div class="prow"><b>'+u.name+'</b><span class="pchip '+(!active?'':zero?'out':low?'low':'good')+'">'+(!active?'Non chargé':zero?'Rupture':low?'Stock faible':'Normal')+'</span></div><div class="pcount">'+PE.map(k=>'<div><small>'+P[k].name+'</small><b>'+(!active?'—':N(st[k]))+'</b></div>').join('')+'</div><button class="pprimary" style="width:100%" onclick="pTransferForm(\''+u.id+'\')">Réapprovisionner</button></div>'}).join('')+'</div>'}
 if(substock==='depot'){let d=depot();html+=pCumpInfo()+'<div class="card"><h2>Stock général</h2>'+PE.map(k=>'<div class="prow"><span>'+P[k].name+'</span><b>'+N(d[k])+' unités</b></div>').join('')+'</div><div class="card"><h2>Ajouter / corriger</h2><div class="pform"><div><label>Produit</label><select id="sp">'+PE.map(k=>'<option value="'+k+'">'+P[k].name+'</option>').join('')+'</select></div><div><label>Opération</label><select id="ss"><option value="1">Entrée</option><option value="-1">Sortie</option></select></div><div><label>Quantité</label><input id="sq" type="number" min="1" step="1" placeholder="10"></div><div><label>Motif</label><select id="sr"><option>Don fournisseur</option><option>Correction inventaire</option><option>Perte / casse</option><option>Retour</option></select></div></div><button class="pprimary" onclick="pManualMove()">Enregistrer</button><p class="psmall">Les dons n’ajoutent aucune dépense financière.</p></div>'}
 if(substock==='historique'){html+='<div class="card"><h2>Historique des mouvements</h2>'+(moves().length?moves().slice(-80).reverse().map(m=>'<div class="prow"><span>'+safe(m.why)+' · '+P[m.key].name+'<br><small class="psmall">'+new Date(m.at).toLocaleString('fr-FR')+'</small></span><b class="'+(m.delta>=0?'pplus':'pminus')+'">'+(m.delta>0?'+':'')+m.delta+'</b></div>').join(''):'<p class="psmall">Aucun mouvement.</p>')+'</div>'}

}
function pManualMove(){let k=document.getElementById('sp').value,q=Math.floor(N(document.getElementById('sq').value))*Number(document.getElementById('ss').value);if(!q)return alert('Indique une quantité valide.');try{let reason=document.getElementById('sr').value;valuation();pMove(k,q,reason,'Patron');if(q>0){cumpIn(k,q,0)}else{cumpOut(k,-q)}pStocks()}catch(e){alert(e.message)}}

function pFinances(){ptab='finances';let tx=sales().filter(t=>matchRange(t.at)),ca=tx.reduce((a,t)=>a+t.total,0),salary=ca*.4,ex=expenses().filter(x=>matchRange(x.at)),pu=purchases().filter(x=>matchRange(x.at)),exSum=ex.reduce((a,x)=>a+x.ttc,0),puSum=pu.reduce((a,x)=>a+x.ttc,0),costs=pg('costs',{}),sold={};tx.forEach(t=>(t.items||[]).forEach(i=>sold[i.key]=(sold[i.key]||0)+i.qty));let cogs=round(tx.reduce((sum,t)=>sum+(Number.isFinite(t.cogs)?t.cogs:(t.items||[]).reduce((v,i)=>v+i.qty*N(costs[i.key]),0)),0)),estimate=round(ca-salary-exSum-cogs),cashBalance=round(ca-puSum-exSum),isEstimate=round(Math.max(0,estimate)*.15);
 let html='<h2>Finances</h2><div class="pInfo">Marge = CA − coût des produits vendus. Les dons fournisseurs abaissent le coût moyen pondéré (CUMP) de tout le stock du produit ; chaque vente utilise ce coût moyen. Résultat indicatif = marge − commissions théoriques − autres dépenses. Trésorerie indicative = CA − achats payés − dépenses payées (avant commissions payées). Les anciennes ventes sans coût enregistré restent estimées.</div>'+pSubtabs([['resume','Synthèse'],['depenses','Dépenses'],['achats','Achats'],['commissions','Vendeurs'],['compta','Comptabilité']],subfin,'pSetFinance')+pRange();
 if(subfin==='resume')html+=pCumpInfo()+'<div class="pgrid">'+tile('Chiffre d’affaires',E(ca))+tile('Coût marchandises vendues estimé',E(cogs))+tile('Marge brute indicative',E(ca-cogs))+tile('Rémunération 40 %',E(salary))+tile('Autres dépenses TTC',E(exSum))+tile('Résultat de gestion avant IS (indicatif)',E(estimate),estimate>=0?'pplus':'pminus')+tile('IS simulé à 15 %',E(isEstimate))+tile('Après IS simulé',E(estimate-isEstimate))+tile('Flux brut avant commissions payées',E(cashBalance))+'</div><div class="card"><h2>Achats et investissements</h2><div class="prow"><span>Achats de marchandises TTC</span><b>'+E(puSum)+'</b></div><p class="psmall">Achats déduits du flux de trésorerie, pas une seconde fois du résultat : seul le coût des produits vendus entre dans la marge. Les rémunérations ne sont pas déduites du flux tant que leur paiement n’est pas suivi.</p><div class="warn">Le solde affiché n’est ni un EBITDA comptable ni un résultat net. Il ne prend pas encore en compte amortissements, charges sociales et ajustements fiscaux. IS simulé à 15 % sous réserve d’éligibilité. Franchise de TVA supposée, achats valorisés TTC.</div></div>';
 if(subfin==='depenses')html+='<div class="card"><h2>Dépenses · '+E(exSum)+'</h2>'+(ex.length?ex.slice().reverse().map(x=>'<div class="prow"><span>'+safe(x.name)+'<br><small class="psmall">'+x.at.slice(0,10)+' · '+safe(x.note)+'</small></span><b>'+E(x.ttc)+'</b></div>').join(''):'<p class="psmall">Aucune dépense.</p>')+'</div><div class="card"><h2>Ajouter une dépense</h2><div class="pform"><div><label>Nom</label><input id="en" placeholder="Neige carbonique, assurance…"></div><div><label>Montant TTC</label><input id="ea" type="number" min="0.01" step="0.01"></div><div><label>Date</label><input id="ed" type="date" value="'+dateKey()+'"></div><div><label>Note / fournisseur</label><input id="et" placeholder="Facultatif"></div></div><button class="pprimary" onclick="pExpense()">Enregistrer la dépense</button></div>';
 if(subfin==='achats')html+='<div class="card"><h2>Achats · '+E(puSum)+'</h2>'+(pu.length?pu.slice().reverse().map(x=>'<div class="prow"><span>'+P[x.key].name+' · '+x.qty+' unités<br><small class="psmall">'+x.at.slice(0,10)+' · '+safe(x.supplier)+'</small></span><b>'+E(x.ttc)+'</b></div>').join(''):'<p class="psmall">Aucun achat.</p>')+'</div><div class="card"><h2>Achat fournisseur → dépôt</h2><div class="pform"><div><label>Produit</label><select id="ap">'+PE.map(k=>'<option value="'+k+'">'+P[k].name+'</option>').join('')+'</select></div><div><label>Quantité</label><input id="aq" type="number" min="1" step="1"></div><div><label>Fournisseur</label><input id="as" placeholder="Nom"></div><div><label>TVA</label><select id="ar" onchange="pCalcPurchase()"><option value="0">0 %</option><option value="5.5">5,5 %</option><option value="10">10 %</option><option value="20">20 %</option></select></div><div><label>HT</label><input id="ah" type="number" min="0" step="0.01" oninput="pCalcPurchase(\'ht\')"></div><div><label>TVA (€)</label><input id="av" type="number" min="0" step="0.01" oninput="pCalcPurchase(\'vat\')"></div><div><label>TTC</label><input id="at" type="number" min="0" step="0.01" oninput="pCalcPurchase(\'ttc\')"></div><div><label>Date</label><input id="ad" type="date" value="'+dateKey()+'"></div></div><p class="psmall">La TVA est calculée à partir du taux sélectionné. Montants utilisés à titre de suivi, pas de déclaration fiscale.</p><button class="pprimary" onclick="pPurchase()">Enregistrer l’achat et le stock</button></div>';
 if(subfin==='commissions')html+='<div class="card"><h2>Rémunérations théoriques · '+E(salary)+'</h2><p class="psmall">40 % du CA par vendeur, hors cotisations et règles du droit du travail.</p></div>'+STAFF.map(u=>{let a=tx.filter(t=>t.sellerId===u.id),sum=a.reduce((s,t)=>s+t.total,0),by={};a.forEach(t=>{let d=dateKey(new Date(t.at));by[d]=(by[d]||0)+t.total});return '<details class="card"><summary class="prow"><b>'+u.name+'</b><b>'+E(sum*.4)+'</b></summary><p class="psmall">CA : '+E(sum)+'</p>'+Object.entries(by).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,v])=>'<div class="prow"><span>'+d+' · CA '+E(v)+'</span><b>'+E(v*.4)+'</b></div>').join('')+'</details>'}).join('');
 if(subfin==='compta')html+='<div class="card"><h2>Suivi comptable simplifié</h2>'+[['CA',ca],['Coût produits vendus estimé',cogs],['Rémunérations théoriques',salary],['Autres dépenses TTC',exSum],['Solde de gestion indicatif',estimate]].map(([k,v])=>'<div class="prow"><span>'+k+'</span><b>'+E(v)+'</b></div>').join('')+'<div class="warn">Résultat net, EBITDA, EBIT et IS : non calculés tant que les règles comptables et fiscales ne sont pas paramétrées.</div></div>';
 pFrame(html);
}
function pExpense(){let name=document.getElementById('en').value.trim(),ttc=round(document.getElementById('ea').value),d=document.getElementById('ed').value,note=document.getElementById('et').value;if(!name||ttc<=0||!d)return alert('Nom, date et montant positif requis.');ps('expenses',[...expenses(),{name,ttc,at:d+'T12:00:00',note}]);pFinances()}
function pCalcPurchase(src='ttc'){let r=N(document.getElementById('ar').value)/100,h=N(document.getElementById('ah').value),v=N(document.getElementById('av').value),t=N(document.getElementById('at').value);if(src==='ht'){v=round(h*r);t=round(h+v)}else if(src==='vat'){if(!r)return;h=round(v/r);t=round(h+v)}else{h=round(t/(1+r));v=round(t-h)}for(let [id,val] of [['ah',h],['av',v],['at',t]])if(id!==({ht:'ah',vat:'av',ttc:'at'}[src]))document.getElementById(id).value=val.toFixed(2)}
function pPurchase(){let k=document.getElementById('ap').value,q=Math.floor(N(document.getElementById('aq').value)),h=round(document.getElementById('ah').value),v=round(document.getElementById('av').value),t=round(document.getElementById('at').value),rate=N(document.getElementById('ar').value),d=document.getElementById('ad').value,supplier=document.getElementById('as').value.trim();if(!q||t<=0||!d)return alert('Quantité, date et TTC positif requis.');if(Math.abs(h+v-t)>.02||Math.abs(round(h*rate/100)-v)>.03)return alert('Montants HT / TVA / TTC incohérents avec le taux.');let old=depot()[k]||0,costs=pg('costs',{});updateCost(k,q,t);ps('purchases',[...purchases(),{key:k,qty:q,ht:h,vat:v,ttc:t,rate,at:d+'T12:00:00',supplier}]);pMove(k,q,'Achat fournisseur',supplier||'Patron');pFinances();alert('Achat enregistré et stock du dépôt augmenté de '+q+' unités.')}
function pData(){ptab='donnees';let count=sales().length,ss=Object.keys(sessions()).length,seeded=pg('demoSeeded',false);pFrame('<h2>Données et sauvegarde</h2><div class="pInfo">Catalogue : 21 références détaillées (glaces, beignets, canettes, eau), plus 4 catégories historiques pour préserver les ventes existantes. 11 photos fournies sont intégrées au fichier ; les autres références affichent leur nom en attendant un visuel vérifié. Prix provisoires : 3 € sauf eau 2 €. Coûts réels à renseigner dans Achats.</div><div class="card"><h2>Jeu de données fictives</h2><p class="psmall">30 jours de ventes, 3 vendeurs, achats, frais, stocks, transferts et clôtures. Les données sont stockées localement sur cet appareil. Tu peux continuer à enregistrer des opérations normalement.</p><div class="prow"><span>Jeu de démonstration</span><b>'+(seeded?'Installé ✓':'Non installé')+'</b></div><button class="pprimary" onclick="pSeedDemo()">'+(seeded?'Recréer les 30 jours fictifs':'Charger 30 jours fictifs')+'</button><p class="psmall">Pour éviter de mélanger des données, le chargement demande une confirmation et remplace toutes les données opérationnelles de ce navigateur.</p></div><div class="card"><h2>État local</h2><div class="prow"><span>Transactions enregistrées</span><b>'+count+'</b></div><div class="prow"><span>Sessions vendeurs</span><b>'+ss+'</b></div><button class="pprimary" onclick="pExport()">Exporter une sauvegarde JSON</button></div><div class="card"><h2>Remise à zéro</h2><p class="psmall">Efface les ventes, les clôtures, les stocks, les achats, les dépenses et les coûts enregistrés sur cet appareil. Les vendeurs et les prix restent dans l’application.</p><button class="pprimary" style="background:#9b3946" onclick="pResetAll()">Effacer les données opérationnelles</button></div><div class="card"><h2>Limites de la V0</h2><p class="psmall">Pas de synchronisation entre vendeurs, de véritable paiement carte, de sécurité serveur, de comptabilité officielle ou de fonctionnement hors connexion garanti. Ne pas utiliser comme caisse de production.</p></div>')}
function pResetAll(){if(!confirm('ATTENTION : effacer toutes les données opérationnelles de CET appareil ? Exporte une sauvegarde avant.'))return;let phrase=prompt('Pour confirmer, écris exactement EFFACER');if(phrase!=='EFFACER')return;for(let k of ['cpSales','cpSessions','cpPatronV0_depot','cpPatronV0_moves','cpPatronV0_expenses','cpPatronV0_purchases','cpPatronV0_costs','cpPatronV0_demoSeeded','cpPatronV0_freeDepot','cpPatronV0_freeCarts','cpPatronV0_valuation'])localStorage.removeItem(k);cart={};pData();alert('Données opérationnelles locales effacées. Les prix et vendeurs sont conservés.')}
function pSeedDemo(){let occupied=sales().length||Object.keys(sessions()).length||expenses().length||purchases().length;if(occupied&&!confirm('Le chargement remplacera toutes les données opérationnelles sur cet appareil. As-tu exporté une sauvegarde ?'))return; if(!occupied&&!confirm('Créer les 30 jours de données fictives sur cet appareil ?'))return;
 let allSales=[],allSessions={},allMoves=[],allExpenses=[],allPurchases=[],stock={ice:530,soda:620,water:690,donut:420};
 let cost={ice:1.12,soda:.77,water:.43,donut:.95};let seed=314159;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 const today=new Date();today.setHours(12,0,0,0);
 const days=[];for(let offset=29;offset>=0;offset--){let d=new Date(today);d.setDate(d.getDate()-offset);days.push(dateKey(d))}
 const names=[['0902','Luna'],['1201','Lucas'],['1301','Emma']];
 days.forEach((day,di)=>{let dow=new Date(day+'T12:00:00').getDay(),busy=(dow===0||dow===6)?1.35:1;
 names.forEach(([id,name],si)=>{let opening={ice:30,soda:24,water:30,donut:20},st={...opening},dayTx=[],cash=0;
 let n=Math.round((10+rand()*13)*busy+(si===1?4:0));for(let j=0;j<n;j++){let items=[],subtotal=0;let count=1+Math.floor(rand()*3);for(let a=0;a<count;a++){let k=PE[Math.floor(rand()*PE.length)],q=1+Math.floor(rand()*2);if(st[k]<q)continue;let found=items.find(i=>i.key===k);if(found)found.qty+=q;else items.push({key:k,name:P[k].name,qty:q,unit:P[k].price});st[k]-=q;subtotal+=q*P[k].price}if(!items.length)continue;
 let payment=rand()<.58?'Espèces':'Carte',hour=10+Math.floor(j*8/n),minute=Math.floor(rand()*60),at=day+'T'+String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0')+':00';let t={id:'demo-'+day+'-'+id+'-'+j,at,sellerId:id,seller:name,total:subtotal,payment,received:payment==='Espèces'?Math.ceil(subtotal/5)*5:null,items};allSales.push(t);dayTx.push(t);if(payment==='Espèces')cash+=subtotal}
 let closed=di!==29;let ss={sellerId:id,seller:name,date:day,openedAt:day+'T09:00:00',openingFloat:50,loaded:true,closed,stock:st,initialStock:opening,loadedAt:day+'T09:15:00'};
 if(closed){ss.physicalStock={...st};ss.stockDiff={ice:0,soda:0,water:0,donut:0};ss.actualCash=50+cash;ss.theoreticalCash=50+cash;ss.cashDiff=0;ss.deposit=cash;ss.floatMix={10:1,5:3,2:5,1:10,.5:10};ss.closedAt=day+'T19:30:00'}
 allSessions[id+'-'+day]=ss;

 });

 if(di%4===0){let categories=[['Neige carbonique',42],['Carburant',36],['Électricité',24],['Assurance',19],['Entretien matériel',31]];let [name,amount]=categories[(di/4)%categories.length|0];allExpenses.push({name,ttc:amount,at:day+'T08:30:00',note:'Exemple fictif'})}
 });
 allExpenses.push({name:'Terminal de paiement',ttc:49,at:days[3]+'T10:00:00',note:'Frais fictifs'});
 allMoves.push({key:'ice',qty:24,why:'Don fournisseur',at:days[19]+'T08:10:00',who:'Patron'});
 allMoves.push({key:'water',qty:-12,why:'Transfert vers Lucas',at:days[29]+'T11:00:00',who:'Patron'});
 allSessions['1201-'+days[29]].stock.water+=12;
 saveSales(allSales);saveSessions(allSessions);ps('depot',stock);ps('moves',allMoves);ps('expenses',allExpenses);ps('purchases',allPurchases);ps('costs',cost);ps('freeDepot',{});ps('freeCarts',{});let vv={};for(const k of PE){let qty=N(stock[k]);for(const [sid,ss] of Object.entries(allSessions))if(sid.endsWith('-'+dateKey())&&ss.loaded&&!ss.closed)qty+=N(ss.stock?.[k]);vv[k]={qty,value:qty*N(cost[k])}}ps('valuation',vv);ps('demoSeeded',true);cart={};pperiod='jour';pdate=dateKey();pstaff='';pData();alert(allSales.length+' ventes fictives réparties sur 30 jours ont été créées. Ouvre Ventes, Stocks et Finances.');}
