<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Caisse Plage</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f4f6f9;color:#17202b}button,input{font:inherit}.w{max-width:720px;margin:auto;padding:18px 16px 100px}.card{background:#fff;border:1px solid #e1e6ed;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 7px 22px #17202b10}h1{margin:4px 0 14px}.muted{color:#687386}.big{width:100%;border:0;border-radius:16px;padding:17px;font-weight:800;font-size:18px}.primary{background:#17202b;color:#fff}.secondary{background:#e8ecf2}.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.prod{border:0;border-radius:18px;min-height:120px;padding:16px;text-align:left;font-weight:850;font-size:20px}.prod small{display:block;margin-top:8px}.ice{background:#3c4148;color:#fff}.soda{background:#d84a4a;color:#fff}.water{background:#a9dcf4}.donut{background:#e6bc72}.line,.total{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #e1e6ed}.total{font-size:25px;font-weight:900;border:0;padding-top:15px}.paygrid,.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pay,.note{border:0;border-radius:16px;padding:20px;font-weight:900;font-size:18px}.cash{background:#3ca769;color:#fff}.cardpay{background:#5267d8;color:#fff}.n5{background:#c8cbd0}.n10{background:#e8929c}.n20{background:#6ba9e8;color:#fff}.n50{background:#e6a45f}.back{border:0;background:transparent;font-weight:800;padding:10px 0}.nav{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;border-top:1px solid #e1e6ed;padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:9}.navin{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.nav button{border:0;border-radius:12px;padding:11px 4px;font-weight:750}.hidden{display:none}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:#fff;border:1px solid #e1e6ed;border-radius:16px;padding:15px}.kpi b{display:block;font-size:23px;margin-top:5px}.sellerBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sellerBtns button{border:0;border-radius:14px;padding:14px 4px;font-weight:800}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid #e1e6ed}.count{display:grid;grid-template-columns:1fr 90px;align-items:center;gap:10px;margin:8px 0}.count input{padding:11px;width:100%;border:1px solid #e1e6ed;border-radius:12px;text-align:center}.login{max-width:430px;margin:10vh auto}.login input{width:100%;padding:18px;border:1px solid #e1e6ed;border-radius:14px;font-size:22px;text-align:center;margin:12px 0}@media(min-width:650px){.products{grid-template-columns:repeat(4,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="app"></div><div id="nav" class="nav hidden"><div class="navin"><button onclick="till()">🧾 Caisse</button><button onclick="closeDay()">🌙 Fin journée</button><button onclick="dash()">📊 Patron</button></div></div><script>
const P={ice:["Glace",3,"ice"],soda:["Canette",3,"soda"],water:["Eau",2,"water"],donut:["Beignet",3,"donut"]},S={"0902":"Luna","1201":"Lucas","1301":"Emma"};let seller=null,cart={},received=0;
const E=n=>Number(n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"}),A=()=>{try{return JSON.parse(localStorage.getItem("cpSales")||"[]")}catch{return[]}},save=a=>localStorage.setItem("cpSales",JSON.stringify(a)),total=()=>Object.entries(cart).reduce((s,[k,q])=>s+P[k][1]*q,0);
function page(x,n=true){document.querySelector("#app").innerHTML='<div class="w">'+x+"</div>";document.querySelector("#nav").classList.toggle("hidden",!n)}
function login(){page(`<div class="login card"><h1>Caisse Plage</h1><p class="muted">Connexion vendeur</p><input id="id" inputmode="numeric" placeholder="Numéro vendeur"><button class="big primary" onclick="log()">Se connecter</button><p class="muted" style="text-align:center">Test : Luna — 0902</p></div>`,false)}
function log(){let id=document.querySelector("#id").value.trim();if(!S[id])return alert("Numéro vendeur inconnu.");seller={id,name:S[id]};till()}
function till(){if(!seller)return login();let lines=Object.entries(cart).map(([k,q])=>`<div class="line"><span>${q} × ${P[k][0]}</span><b>${E(q*P[k][1])}</b></div>`).join("")||'<p class="muted">Panier vide</p>';page(`<button class="back" onclick="seller=null;cart={};login()">Déconnexion</button><h1>${seller.name}</h1><div class="products">${Object.entries(P).map(([k,p])=>`<button class="prod ${p[2]}" onclick="cart['${k}']=(cart['${k}']||0)+1;till()">${p[0]}<small>${E(p[1])}</small></button>`).join("")}</div><div class="card"><h2>Panier</h2>${lines}<div class="total"><span>Total</span><span>${E(total())}</span></div></div><button class="big primary" onclick="payment()">Valider la vente</button>`)}
function payment(){if(!total())return;page(`<button class="back" onclick="till()">← Retour</button><h1>Paiement</h1><div class="card total"><span>À payer</span><span>${E(total())}</span></div><div class="paygrid"><button class="pay cash" onclick="cash()">💶 Espèces</button><button class="pay cardpay" onclick="finish('Carte')">💳 Carte</button></div>`)}
function cash(){page(`<button class="back" onclick="payment()">← Retour</button><h1>Espèces</h1><div class="card"><div class="total"><span>À payer</span><span>${E(total())}</span></div><div class="notes"><button class="note n5" onclick="recv(5)">5 €</button><button class="note n10" onclick="recv(10)">10 €</button><button class="note n20" onclick="recv(20)">20 €</button><button class="note n50" onclick="recv(50)">50 €</button></div><input id="manual" inputmode="decimal" placeholder="Autre montant reçu" style="width:100%;margin-top:12px;padding:15px;border:1px solid #ddd;border-radius:12px"><button class="big secondary" style="margin-top:10px" onclick="recv(parseFloat(document.querySelector('#manual').value.replace(',','.')))">Calculer</button><div id="change"></div></div>`)}
function recv(n){if(!Number.isFinite(n)||n<total())return alert("Montant insuffisant.");received=n;document.querySelector("#change").innerHTML=`<h2 style="text-align:center">Monnaie : ${E(n-total())}</h2><button class="big cash" onclick="finish('Espèces')">Valider l'encaissement</button>`}
function finish(mode){let a=A(),items=Object.entries(cart).map(([k,q])=>({name:P[k][0],qty:q,unit:P[k][1]})),v=total();a.push({id:"tx-"+Date.now()+"-"+Math.random().toString(16).slice(2),at:new Date().toISOString(),sellerId:seller.id,seller:seller.name,total:v,payment:mode,received:mode==="Espèces"?received:null,items});save(a);cart={};page(`<div class="card" style="text-align:center;margin-top:20vh"><h1>✓ Vente enregistrée</h1><h2>${E(v)}</h2><p class="muted">${mode} · ${seller.name}</p><button class="big primary" onclick="till()">Nouvelle vente</button></div>`)}
function today(){let d=new Date().toLocaleDateString("fr-CA");return A().filter(t=>new Date(t.at).toLocaleDateString("fr-CA")===d)}
function dash(filter=null){let a=today(),v=filter?a.filter(t=>t.seller===filter):a,ca=v.reduce((s,t)=>s+t.total,0),cash=v.filter(t=>t.payment==="Espèces").reduce((s,t)=>s+t.total,0),rows=[...v].reverse().map(t=>`<tr><td>${new Date(t.at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</td><td>${t.seller}</td><td>${t.payment}</td><td><b>${E(t.total)}</b></td></tr>`).join("")||'<tr><td colspan="4">Aucune vente</td></tr>';page(`<h1>${filter||"Vue globale"}</h1><div class="card" style="text-align:center"><span class="muted">CA aujourd'hui</span><div style="font-size:42px;font-weight:950">${E(ca)}</div></div><div class="sellerBtns"><button onclick="dash('Luna')">Luna</button><button onclick="dash('Lucas')">Lucas</button><button onclick="dash('Emma')">Emma</button></div><div class="kpis" style="margin-top:12px"><div class="kpi">Ventes<b>${v.length}</b></div><div class="kpi">Panier moyen<b>${E(v.length?ca/v.length:0)}</b></div><div class="kpi">Espèces<b>${E(cash)}</b></div><div class="kpi">Carte<b>${E(ca-cash)}</b></div></div><div class="card" style="overflow:auto"><h2>Transactions</h2><table><tr><th>Heure</th><th>Vendeur</th><th>Paiement</th><th>Total</th></tr>${rows}</table></div>${filter?'<button class="big secondary" onclick="dash()">Vue globale</button>':""}`)}
const D=[50,20,10,5,2,1,.5,.2,.1];function closeDay(){if(!seller)return login();let cs=today().filter(t=>t.sellerId===seller.id&&t.payment==="Espèces").reduce((s,t)=>s+t.total,0),f=100,th=f+cs;page(`<h1>Fin de journée</h1><p class="muted">${seller.name}</p><div class="kpis"><div class="kpi">Fond initial<b>${E(f)}</b></div><div class="kpi">Ventes espèces<b>${E(cs)}</b></div></div><div class="card"><div class="total"><span>Caisse théorique</span><span>${E(th)}</span></div><p class="muted">Compte physiquement la caisse :</p>${D.map(d=>`<div class="count"><b>${E(d)}</b><input class="cnt" data-v="${d}" inputmode="numeric" value="0" oninput="calc(${th},${f})"></div>`).join("")}</div><div id="res"></div>`)}
function calc(th,f){let c=[...document.querySelectorAll(".cnt")].reduce((s,i)=>s+(parseInt(i.value)||0)*parseFloat(i.dataset.v),0),diff=c-th,dep=Math.max(0,c-f);document.querySelector("#res").innerHTML=`<div class="card"><div class="line"><span>Compté</span><b>${E(c)}</b></div><div class="line"><span>Écart</span><b>${diff>=0?"+":""}${E(diff)}</b></div><div class="line"><span>Fond à conserver</span><b>${E(Math.min(f,c))}</b></div><div class="total"><span>À déposer au coffre</span><span>${E(dep)}</span></div></div><p class="muted">Prototype : le fond de caisse est fixé à 100 €. La composition exacte en billets/pièces sera optimisée ensuite selon les espèces réellement comptées.</p>`}login();
</script></body></html>
